            <div class="logo-center"></div>
            <div class="message">
                <h1 id="idleMonitorWarningDialogTitle" class="pseudo-modal-title">Inactive session warning!</h1>
                <hr class="message-separator">

            <div idle-countdown="countdown" ng-init="countdown=ENV_SETTINGS.IDLE_WARNING_SECONDS" class="modal-body">

                <!--<uib-progressbar max="100" ng-if="ENV_SETTINGS['IDLE_WARNING_SECONDS']" value="countdown * 100 / parseInt(ENV_SETTINGS.IDLE_WARNING_SECONDS)" animate="true" class="progress-striped active" type="warning">{{ENV_SETTINGS['IDLE_WARNING_SECONDS']}} You will be logged out in {{countdown}} second(s).</uib-progressbar>-->
            </div>
        </div>
    </div>
</script>
